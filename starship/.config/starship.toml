# Starship prompt. Switch theme by changing `palette` below.
# Preview the terminal side with: ghostty +list-themes
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'monokai_remastered'

add_newline = true
command_timeout = 500

format = """
$directory\
$git_branch\
$git_status\
$ruby\
$nodejs\
$python\
$kubernetes\
$aws\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold mauve)'

[directory]
style = 'bold blue'
truncation_length = 3
truncation_symbol = '…/'
read_only = ' 󰌾'

[git_branch]
symbol = ' '
style = 'bold mauve'
format = '[on $symbol$branch]($style) '

[git_status]
style = 'yellow'
format = '([\[$all_status$ahead_behind\]]($style) )'

[ruby]
symbol = ' '
style = 'red'
format = '[$symbol($version)]($style) '

[nodejs]
symbol = ' '
style = 'green'
format = '[$symbol($version)]($style) '

[python]
symbol = ' '
style = 'yellow'
format = '[$symbol($version)]($style) '

[kubernetes]
disabled = false
symbol = '󱃾 '
style = 'sapphire'
format = '[$symbol$context]($style) '

[aws]
symbol = ' '
style = 'peach'
format = '[$symbol($profile )]($style)'

[cmd_duration]
min_time = 3000
style = 'overlay'
format = '[took $duration]($style) '

