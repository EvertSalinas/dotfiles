live_config_reload = true

# Copy the matching platform file to ~/.config/alacritty/platform.toml:
#   alacritty.macos.toml  →  macOS
#   alacritty.linux.toml  →  Linux
import = ["~/.config/alacritty/platform.toml"]

[env]
TERM = "xterm-256color"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\r"

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[window]
startup_mode = "Maximized"
opacity = 0.6
blur = true
