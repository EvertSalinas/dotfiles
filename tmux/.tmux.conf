unbind C-b
set -g prefix C-s
bind -r C-s send-prefix

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

# Pane splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

# Session switcher (replaces the default `s` choose-tree): tmux sessions, tmuxinator projects, zoxide dirs.
# `C-s w` still opens the window-level choose-tree.
bind s display-popup -E -w 80% -h 70% "sesh picker -i -H -d"

# Pane navigation in copy mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

set -g display-panes-time 4000
set -g display-time 4000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
set -g history-limit 5000

set-option -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Theme: TokyoNight Night (matches ghostty-mac theme and starship palette)
# bg #1a1b26  bar #16161e  fg #c0caf5  grey #565f89  line #292e42  selection #283457
# blue #7aa2f7  green #9ece6a  orange #ff9e64  purple #bb9af7  magenta #ff007c
set -g status-style "fg=#c0caf5,bg=#16161e"
set -g status-left-length 30
set -g status-left "#[fg=#16161e,bg=#9ece6a,bold] #S #[fg=#9ece6a,bg=#16161e] "
set -g window-status-separator ""
set -g window-status-format "#[fg=#565f89] #I #W "
set -g window-status-current-format "#[fg=#16161e,bg=#7aa2f7,bold] #I #W #[fg=#7aa2f7,bg=#16161e]"
set -g window-status-activity-style "fg=#ff9e64"
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#ff007c"
set -g message-style "fg=#16161e,bg=#ff9e64"
set -g message-command-style "fg=#16161e,bg=#ff9e64"
set -g mode-style "fg=#c0caf5,bg=#283457"

set-option -g focus-events on

# Vi copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# macOS clipboard (pbcopy/pbpaste) has worked natively inside tmux since Sierra (2016),
# so reattach-to-user-namespace is no longer needed and was leaking orphaned shell
# processes on every pane respawn/continuum restore cycle. Disabled 2026-09-10.
# if-shell "uname | grep -q Darwin" \
#   "set-option -g default-command 'reattach-to-user-namespace -l $SHELL'"

set-option -g display-panes-active-colour "#ff007c"
set-option -g display-panes-colour "#565f89"

set-option -g status-right "#[fg=#565f89]#(date '+%a, %b %d') #[fg=#16161e,bg=#bb9af7,bold] #(date '+%I:%M') "

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'samoshkin/tmux-plugin-sysstat'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

run -b '~/.tmux/plugins/tpm/tpm'
