unbind C-b
set -g prefix C-s
bind -r C-s send-prefix

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

# Pane splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

# Session switcher (replaces the default `s` choose-tree): tmux sessions, tmuxinator projects, zoxide dirs.
# `C-s w` still opens the window-level choose-tree.
bind s display-popup -E -w 80% -h 70% "sesh picker -i -H -d"

# Pane navigation in copy mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

set -g display-panes-time 4000
set -g display-time 4000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
set -g history-limit 5000

set-option -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Theme: Monokai Remastered (matches ghostty-mac theme and starship palette)
# bg #0c0c0c  fg #d9d9d9  grey #625e4c  line #343434
# pink #f4005f  green #98e024  orange #fd971f  purple #9d65ff  cyan #58d1eb
set -g status-style "fg=#d9d9d9,bg=#0c0c0c"
set -g status-left-length 30
set -g status-left "#[fg=#0c0c0c,bg=#98e024,bold] #S #[fg=#98e024,bg=#0c0c0c] "
set -g window-status-separator ""
set -g window-status-format "#[fg=#625e4c] #I #W "
set -g window-status-current-format "#[fg=#0c0c0c,bg=#58d1eb,bold] #I #W #[fg=#58d1eb,bg=#0c0c0c]"
set -g window-status-activity-style "fg=#fd971f"
set -g pane-border-style "fg=#343434"
set -g pane-active-border-style "fg=#f4005f"
set -g message-style "fg=#0c0c0c,bg=#fd971f"
set -g message-command-style "fg=#0c0c0c,bg=#fd971f"
set -g mode-style "fg=#ffffff,bg=#343434"

set-option -g focus-events on

# Vi copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# macOS clipboard (pbcopy/pbpaste) has worked natively inside tmux since Sierra (2016),
# so reattach-to-user-namespace is no longer needed and was leaking orphaned shell
# processes on every pane respawn/continuum restore cycle. Disabled 2026-09-10.
# if-shell "uname | grep -q Darwin" \
#   "set-option -g default-command 'reattach-to-user-namespace -l $SHELL'"

set-option -g display-panes-active-colour "#f4005f"
set-option -g display-panes-colour "#625e4c"

set-option -g status-right "#[fg=#625e4c]#(date '+%a, %b %d') #[fg=#0c0c0c,bg=#9d65ff,bold] #(date '+%I:%M') "

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'samoshkin/tmux-plugin-sysstat'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

run -b '~/.tmux/plugins/tpm/tpm'
